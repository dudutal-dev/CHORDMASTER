  --tungsten:#F5B24A; --tungsten-d:#8A6224; --tungsten-glow:rgba(245,178,74,.45);
  --ruby:#F2685A; --jade:#5FD0A8; --violet:#8A7BF0;
  --latin:"Bebas Neue",Impact,sans-serif;
  --disp:"Suez One","Arial Hebrew",Georgia,serif;
  --body:"Heebo","Segoe UI",-apple-system,sans-serif;
  --mono:"Space Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--tolex); color:var(--cream); font-family:var(--body); font-weight:300;
  -webkit-text-size-adjust:100%; overflow-x:hidden;
  background-image:
    radial-gradient(120% 70% at 80% -10%, rgba(138,123,240,.10) 0%, transparent 55%),
    radial-gradient(100% 60% at 10% 0%, rgba(245,178,74,.07) 0%, transparent 50%),
    linear-gradient(180deg,#0C0E12 0%, #08090C 40%);
  background-attachment:fixed;
  min-height:100vh;
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--tungsten);outline-offset:2px}
h1,h2,h3{font-family:var(--disp);font-weight:400;line-height:1.25;margin:0;letter-spacing:-.01em}

/* ---- chassis / top ---- */
.top{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid #1B2430;
  padding-top:env(safe-area-inset-top,0px);
  background:rgba(8,9,12,.94);
  border-bottom:1px solid #0C0A09; box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 6px 18px rgba(0,0,0,.5)}
.top-in{max-width:1560px;margin:0 auto;padding:9px 14px;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.lamp{width:13px;height:13px;border-radius:50%;flex:0 0 13px;
  background:radial-gradient(circle at 35% 32%, #FFD891, #C87A1A 60%, #5C3A0E);
  box-shadow:0 0 9px var(--tungsten-glow), inset 0 0 4px rgba(0,0,0,.5); transition:.07s}
.lamp.beat{box-shadow:0 0 20px var(--tungsten), 0 0 34px var(--tungsten-glow), inset 0 0 4px rgba(0,0,0,.4)}
.lamp.down{background:radial-gradient(circle at 35% 32%, #FFF0C8, #F0A83C 55%, #8A5F1E)}
.brand{font-family:var(--latin);font-size:23px;letter-spacing:.12em;color:var(--tungsten);
  background:none;border:0;padding:0 2px;cursor:pointer;transition:.15s}
.brand:hover{color:#FFD98A;text-shadow:0 0 18px rgba(245,178,74,.5)}
.brand:active{transform:scale(.97)}
.brand{min-height:38px;display:inline-flex;align-items:center;position:relative;z-index:2}
.ttl{font-size:14px;color:var(--cream-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw;
  border-inline-start:1px solid var(--edge);padding-inline-start:11px}
.top .right{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}

/* ---- controls ---- */
.btn{background:#161B24;color:#CFE0F5;font-weight:500;
  border:1px solid #27313F;border-radius:7px;padding:7px 13px;transition:.14s;white-space:nowrap;
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
.btn:hover{border-color:#4E7FB8;color:#9FC8FF}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--tungsten);border-color:var(--tungsten);color:#12131A;font-weight:700}
.btn.primary:hover{background:#FFC663;color:#12131A}
.btn.on{background:var(--jade);border-color:var(--jade);color:#08110D;font-weight:700}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.34;cursor:not-allowed}
input[type=text],select,textarea{background:#120F0D;color:var(--cream);
  border:1px solid var(--edge);border-radius:5px;padding:9px 11px;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.45)}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--tungsten-d);outline:none}
textarea{width:100%;min-height:120px;line-height:1.6;resize:vertical}

.wrap{max-width:1560px;margin:0 auto;
  padding:16px calc(14px + env(safe-area-inset-right,0px)) calc(70px + env(safe-area-inset-bottom,0px))
          calc(14px + env(safe-area-inset-left,0px))}
/* במצב אפליקציה עצמאית אין שורת כתובת — הכותרת נצמדת לחריץ */
@media (display-mode: standalone){
  body{padding-bottom:env(safe-area-inset-bottom,0px)}
}

/* ---- panel = amp faceplate ---- */
.panel{background:var(--surface,#14171C);
  border:1px solid var(--edge);border-radius:8px;padding:16px;margin-bottom:12px;
  box-shadow:0 1px 0 rgba(255,255,255,.045) inset, 0 5px 16px rgba(0,0,0,.35)}
.panel h3{font-size:16px;margin:0 0 4px}
.panel .sub{color:var(--cream-2);font-size:13px;margin:0 0 13px;line-height:1.6}
.stamp{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}

.note{border-inline-start:2px solid var(--tungsten-d);background:rgba(240,168,60,.06);
  padding:10px 13px;border-radius:0 5px 5px 0;font-size:13.5px;margin:11px 0;line-height:1.65}
.note.rust{border-color:var(--ruby);background:rgba(216,80,60,.09)}
.note.sage{border-color:var(--jade);background:rgba(127,184,154,.09)}
.note strong{color:var(--tungsten);font-weight:500}
.note.rust strong{color:var(--ruby)} .note.sage strong{color:var(--jade)}

/* ═══ SIGNATURE — מסלול האקורדים הנע ═══ */
.horizon{position:relative;height:134px;border-radius:8px;overflow:hidden;margin-bottom:12px;
  background:
    linear-gradient(180deg,#151A21,#0D1015);
  border:1px solid var(--edge); box-shadow:inset 0 3px 12px rgba(0,0,0,.55)}
.horizon .lane{position:absolute;inset:0;direction:ltr}
.horizon .nowline{position:absolute;top:0;bottom:0;right:126px;width:2px;
  background:linear-gradient(180deg,transparent,var(--tungsten) 18%,var(--tungsten) 82%,transparent);
  box-shadow:0 0 14px var(--tungsten-glow);z-index:3}
.horizon .nowcap{position:absolute;top:5px;right:108px;font-family:var(--mono);font-size:9px;
  letter-spacing:.18em;color:var(--tungsten);z-index:3}
.hchip{position:absolute;top:32px;height:56px;border-radius:5px;
  background:#1C2129;border:1px solid var(--edge-2);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-size:23px;color:var(--cream);
  transition:opacity .2s;white-space:nowrap;overflow:hidden;box-shadow:0 2px 7px rgba(0,0,0,.4)}
.hchip.hot{background:var(--tungsten);border-color:var(--tungsten);color:#12131A;
  box-shadow:0 0 22px var(--tungsten-glow)}
.hchip.silent{opacity:.28;font-size:16px;color:var(--dim)}
.horizon .nowdgm{position:absolute;top:3px;right:4px;width:116px;z-index:4;
  display:flex;align-items:center;justify-content:center}
.horizon .nodgm{font-family:var(--disp);font-size:26px;color:var(--dim);opacity:.5}
.horizon .nowdgm svg{height:126px;width:auto;max-width:100%;display:block}
.nowdgm,#dgm{transform-origin:center;will-change:transform}
.horizon .hzempty{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:10px}
.horizon .hzempty span{font-size:13px;line-height:1.65;color:var(--cream-2);text-align:center;
  border:1px dashed var(--edge-2);border-radius:6px;padding:9px 16px;background:rgba(6,7,9,.5)}
.horizon .hzempty b{color:var(--tungsten);font-weight:500}
.horizon .hzhold{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;
  background:rgba(6,7,9,.66)}
.horizon .hzhold span{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--tungsten);
  border:1px solid var(--tungsten-d);border-radius:4px;padding:7px 14px;text-align:center;line-height:1.6}
.horizon .hzbeats{position:absolute;left:10px;bottom:6px;z-index:3;gap:4px;margin:0}
.horizon .hzbeats i{width:18px;height:4px}
.horizon .fadeout{position:absolute;top:0;bottom:0;left:0;width:70px;z-index:2;
  background:linear-gradient(90deg,#1A1512,transparent);pointer-events:none}

/* ---- stage ---- */
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,430px);gap:13px;align-items:start}
@media(max-width:1020px){.main{grid-template-columns:1fr}}
.main.cinema{grid-template-columns:1fr;max-width:1080px;margin:0 auto}
.main.cinema .horizon{margin-top:13px}
.stage #dgm svg{max-width:150px;height:auto}
.main.cinema .ytbox{box-shadow:0 10px 40px rgba(0,0,0,.6), 0 0 0 1px var(--edge)}
.stickytop{background:var(--tolex)}
@media(max-width:820px){
  .top-in{padding:6px 10px;gap:7px}
  .brand{font-size:16px}
  .ttl{display:none}
  .top .right{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;max-width:100%;padding-bottom:1px}
  .top .right::-webkit-scrollbar{display:none}
  .top .right .btn{font-family:var(--disp);font-weight:400;font-size:14.5px;padding:6px 13px;
  flex:0 0 auto;letter-spacing:.01em;background:rgba(22,27,36,.62);border-color:rgba(120,170,255,.18)}
.top .right .btn:hover{border-color:#5B8FC9;color:#A8CDFF;background:rgba(30,40,55,.75)}
  .top .right #toStrip{position:sticky;right:0;z-index:2;background:#241D10;
    border-color:var(--tungsten-d);color:var(--tungsten);box-shadow:-8px 0 10px -6px rgba(6,7,9,.9)}
  .stickytop{position:sticky;top:var(--topH,44px);z-index:25;padding-bottom:6px;
    box-shadow:0 10px 18px -8px rgba(11,9,8,.95)}
  .stickytop .ytbox{border-radius:0;margin-inline:-14px;width:calc(100% + 28px)}
  .horizon{height:122px;margin-bottom:0}
  .main.cinema .horizon{margin-top:6px}
  .hchip{top:34px;height:56px;font-size:21px}
  .horizon .nowdgm{width:104px;top:3px}
  .horizon .nowdgm svg{height:114px}
  .horizon .nowline{right:112px}
  .horizon .nowcap{right:96px;font-size:8px;top:2px}
  .stage{padding:13px}
  .nowc{font-size:clamp(42px,15vw,64px)}
  .bc{width:60px}
}
@media(max-width:820px) and (orientation:landscape){
  .stickytop{position:sticky;top:var(--topH,44px)}
  .stickytop .ytbox{padding-top:38%}
  .horizon{height:86px}
  .horizon .nowdgm{width:64px;top:6px}
  .horizon .nodgm{font-family:var(--disp);font-size:26px;color:var(--dim);opacity:.5}
.horizon .nowdgm svg{height:74px}
  .horizon .nowline{right:72px}
  .horizon .nowcap{right:56px}
  .hchip{top:22px;height:42px;font-size:18px}
}
.ytbox{position:relative;padding-top:56.25%;background:#000;border-radius:8px;overflow:hidden;
  border:1px solid var(--edge);box-shadow:0 6px 22px rgba(0,0,0,.5)}
.ytbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

.stage{background:#14171C;border:1px solid var(--edge);border-radius:8px;
  padding:16px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;margin-bottom:12px;
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
@media(max-width:520px){.stage{grid-template-columns:1fr}}
.nowc{font-family:var(--disp);font-size:clamp(50px,12vw,82px);line-height:1;color:var(--tungsten);
  margin:3px 0 4px;text-shadow:0 0 26px rgba(240,168,60,.3)}
.nowc.none{color:var(--dim);text-shadow:none;opacity:.4}
.nextr{display:flex;gap:9px;align-items:baseline;color:var(--cream-2);font-size:14px}
.nextr b{color:var(--cream);font-size:25px;font-weight:500;font-family:var(--disp)}
.beats{display:flex;gap:5px;margin-top:11px}
.beats i{width:26px;height:5px;background:#3A302A;border-radius:2px;transition:.06s}
.beats i.on{background:var(--tungsten)} .beats i.down{background:var(--jade)}
svg.dgm{display:block}

/* ---- transport ---- */
.tr{background:#14171C;border:1px solid var(--edge);border-radius:8px;
  padding:11px 14px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tr label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.tr .grp{display:flex;gap:5px;align-items:center}
.time{font-family:var(--mono);font-size:12.5px;color:var(--cream-2)}

/* ---- bar grid ---- */
.catrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 2px;
  border-bottom:1px solid var(--edge)}
/* סגנון מוטבע גובר על כללים — לכן כל מידות השורה מוגדרות כאן בלבד */
.catrow .rowart{width:40px;height:40px;flex:0 0 40px;border-radius:7px}
.catrow .rowart i{font-size:15px}
.catrow .tx{flex:1 1 auto;min-width:clamp(150px,52vw,340px)}
.catrow .tx b{display:block;font-weight:500;font-size:16px;line-height:1.35}
.catrow .tx small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px}
.catrow .stamp{flex:0 0 auto}
.catrow .btn{flex:0 0 auto}
.tile .tx{flex:1 1 auto;min-width:76px}
.chipA{background:#171B21;border:1px solid var(--edge);color:var(--cream);
  border-radius:20px;padding:6px 13px;font-size:14px;display:inline-flex;gap:7px;align-items:baseline;transition:.14s}
.chipA:hover{border-color:var(--tungsten-d);color:var(--tungsten)}
.chipA span{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.abcredit{background:#151920;border:1px solid var(--edge);
  border-inline-start:3px solid var(--tungsten);border-radius:8px;padding:20px 22px;margin:26px 0 8px;
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 6px 20px rgba(0,0,0,.4)}
.abname{font-family:var(--disp);font-size:clamp(26px,6vw,38px);color:var(--tungsten);
  line-height:1.1;margin:8px 0 6px;text-shadow:0 0 30px rgba(240,168,60,.28)}
.abrole{color:var(--cream-2);font-size:13.5px;line-height:1.7}
.grouphead{display:flex;align-items:baseline;gap:9px;font-family:var(--disp);font-size:19px;
  color:var(--tungsten);margin:22px 0 2px;padding-bottom:5px;border-bottom:1px solid var(--edge)}
.grouphead span{font-family:var(--mono);font-size:11px;color:var(--dim)}
.grid{display:flex;flex-wrap:wrap;gap:4px}
.bc{width:66px;background:#171B21;border:1px solid var(--edge);
  border-radius:4px;padding:5px 3px;text-align:center;transition:.1s;color:var(--cream)}
.bc:hover{border-color:var(--tungsten-d)}
.bc.cur{border-color:var(--tungsten);background:rgba(245,178,74,.16);
  box-shadow:0 0 12px rgba(240,168,60,.25)}
.bc.sel{border-color:var(--jade)}
.bc.anch{box-shadow:inset 0 2px 0 var(--jade)}
.bc.ext{opacity:.45;border-style:dashed}
.bc .n{font-family:var(--mono);font-size:9px;color:var(--dim);display:block}
.bc .c{font-family:var(--disp);font-size:15px;display:block;line-height:1.35}
.bc .c.none{color:var(--dim);opacity:.4}

/* ---- lyrics ---- */
.lyr{max-height:400px;overflow:auto;padding-inline-end:5px}
.ll{padding:6px 9px;border-radius:5px;transition:.12s}
.ll.cur{background:linear-gradient(90deg,rgba(245,178,74,.14),transparent)}
.ll .lc{font-family:var(--mono);font-size:12.5px;color:var(--tungsten);letter-spacing:.08em;min-height:16px}
.ll .lx{font-size:16.5px;line-height:1.45}
.ll.cur .lx{color:var(--tungsten)}
.ll.unset{opacity:.42}
.ll .lb{font-family:var(--mono);font-size:10px;color:var(--dim);margin-inline-start:6px}

/* ---- start screen ---- */
.start{max-width:660px;margin:6vh auto;text-align:center}
.hero-amp{font-family:var(--disp);font-size:clamp(28px,6vw,46px);line-height:1.15;margin:0 0 6px}
.hero-amp em{font-style:normal;color:var(--tungsten);text-shadow:0 0 30px rgba(240,168,60,.35)}
.start p{color:var(--cream-2);font-size:15.5px;line-height:1.75;margin:14px 0 26px}
.urlrow{display:flex;gap:8px}.urlrow input{flex:1;text-align:start}
.lib{margin-top:28px;text-align:start}
.libitem{display:flex;gap:10px;align-items:center;padding:10px 12px;
  background:#14171C;border:1px solid var(--edge);border-radius:5px;margin-bottom:7px}
.libitem b{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.libitem small{font-family:var(--mono);font-size:11px;color:var(--dim)}

/* ---- guide ---- */
.guide{max-width:860px;margin:0 auto}
.guide h2{font-size:clamp(24px,4.4vw,34px);margin:0 0 8px}
.guide .lead{color:var(--cream-2);font-size:16px;line-height:1.75;margin:0 0 28px}
.gstep{display:grid;grid-template-columns:52px 1fr;gap:16px;padding:20px 0;border-top:1px solid var(--edge)}
.gnum{font-family:var(--disp);font-size:30px;color:var(--tungsten);line-height:1;opacity:.85}
.gstep h3{font-size:19px;margin:0 0 7px}
.gstep p{margin:0 0 9px;line-height:1.75;color:var(--cream-2);font-size:14.5px}
.gstep p b,.gstep li b{color:var(--cream);font-weight:500}
.gstep ul{margin:8px 0 0;padding-inline-start:18px;color:var(--cream-2);font-size:14.5px;line-height:1.7}
.gstep li{margin-bottom:6px}
kbd{font-family:var(--mono);font-size:12px;background:#120F0D;border:1px solid var(--edge-2);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--tungsten)}
.gtable{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
.gtable th,.gtable td{border:1px solid var(--edge);padding:8px 10px;text-align:start;vertical-align:top}
.gtable th{background:rgba(255,255,255,.03);font-weight:500;font-family:var(--mono);font-size:11px;
  letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.gtable td b{color:var(--tungsten);font-weight:500}

/* ---- overlays ---- */
#splash{position:fixed;inset:0;z-index:200;background:#08090C;overflow:hidden;
  transition:opacity 1.05s ease, transform 1.05s ease}
#splash[hidden]{display:none}
#splash.go{pointer-events:none}
#splash.go .sp-ui{opacity:0;transform:translateY(18px);transition:opacity .5s,transform .5s}
#splash.fade{opacity:0;transform:scale(1.06)}
#splashStage{position:absolute;inset:0;display:grid;place-items:center;perspective:1400px;
  touch-action:none;overflow:hidden}
#splashStage::before{content:"";position:absolute;width:120%;height:75%;
  background:radial-gradient(closest-side, rgba(245,178,74,.22), rgba(138,123,240,.10) 45%, transparent 72%);
  filter:blur(18px)}
/* אלפא אמיתי — לא mix-blend-mode, שיצר מלבן על רקע שאינו שחור טהור */
#splashImg{position:relative;width:min(88vw, 560px);max-height:64vh;object-fit:contain;
  transform-origin:55% 55%;will-change:transform;
  filter:drop-shadow(0 0 46px rgba(120,170,255,.22)) contrast(1.06) saturate(1.08);
  transform:translateY(-4vh)}
#splashSheen{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(105deg,transparent 38%,rgba(255,240,210,.16) 47%,transparent 56%);
  background-size:280% 100%;background-position:120% 0}
.sp-ui{position:absolute;inset:auto 0 env(safe-area-inset-bottom,0px) 0;display:flex;flex-direction:column;align-items:center;
  pointer-events:none;text-align:center;padding:18px 20px max(22px,5vh);
  background:linear-gradient(180deg,transparent,rgba(6,7,9,.72) 42%,rgba(6,7,9,.94))}
@media(min-width:900px){ .sp-ui{padding-bottom:6vh} }
.sp-mark{font-family:var(--mono);font-size:10.5px;letter-spacing:.38em;color:var(--tungsten);
  opacity:0;animation:spIn .9s .25s forwards}
.sp-title{font-family:var(--latin);font-size:clamp(44px,12.5vw,100px);line-height:.92;margin:8px 0 0;
  letter-spacing:.06em;font-weight:400;
  background:linear-gradient(180deg,#FFF6E2 6%,#F3C56B 38%,#C98A2A 62%,#FFE9B8 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 34px rgba(245,178,74,.35)) drop-shadow(0 6px 20px rgba(0,0,0,.85));
  opacity:0;animation:spIn 1s .45s forwards}
.sp-title span{display:block;font-size:.62em;letter-spacing:.30em;margin-top:.06em;
  background:linear-gradient(180deg,#F6E7CB,#B8874A);-webkit-background-clip:text;background-clip:text}
.sp-sub{color:var(--cream-2);font-size:clamp(13px,3.4vw,16px);margin:12px 0 0;letter-spacing:.02em;
  text-shadow:0 2px 12px rgba(0,0,0,.8);opacity:0;animation:spIn 1s .75s forwards}
/* כפתור הכניסה — עקומות במקום קווים ישרים, זהב מלוטש בשפת הגיטרה */
.sp-go{pointer-events:auto;position:relative;margin-top:22px;
  font-family:var(--latin);font-size:23px;letter-spacing:.24em;
  color:#1A1408;padding:15px 56px;border:0;
  border-radius:44px/30px;
  background:
    radial-gradient(120% 180% at 22% 0%, rgba(255,255,255,.55), transparent 46%),
    linear-gradient(180deg,#FFE7AE 0%,#F0BE62 26%,#C68A2C 58%,#8A5A18 78%,#F6D89A 100%);
  box-shadow:
    0 0 0 1px rgba(255,231,174,.75),
    0 0 0 5px rgba(245,178,74,.10),
    0 0 46px rgba(245,178,74,.40),
    0 12px 26px rgba(0,0,0,.6),
    inset 0 2px 3px rgba(255,255,255,.5),
    inset 0 -3px 6px rgba(90,52,10,.45);
  opacity:0;animation:spIn .8s 1.05s forwards;
  transition:transform .14s, box-shadow .25s, filter .25s}
.sp-go::before,.sp-go::after{content:"";position:absolute;top:50%;width:15px;height:15px;
  border:1.4px solid rgba(58,36,8,.5);border-radius:60% 0 60% 0;opacity:.75}
.sp-go::before{inset-inline-start:19px;transform:translateY(-50%) rotate(45deg)}
.sp-go::after{inset-inline-end:19px;transform:translateY(-50%) rotate(-135deg)}
.sp-go:hover{filter:brightness(1.06);
  box-shadow:0 0 0 1px rgba(255,241,206,.9), 0 0 0 6px rgba(245,178,74,.16),
    0 0 66px rgba(245,178,74,.55), 0 12px 26px rgba(0,0,0,.6),
    inset 0 2px 3px rgba(255,255,255,.55), inset 0 -3px 6px rgba(90,52,10,.45)}
.sp-go:active{transform:translateY(2px) scale(.985)}
.sp-hint{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--dim);
  margin-top:16px;opacity:0;animation:spIn 1s 1.6s forwards}
@keyframes spIn{to{opacity:1}}
body.locked{overflow:hidden}
@media (prefers-reduced-motion:reduce){
  .sp-mark,.sp-title,.sp-sub,.sp-go,.sp-hint{animation:none;opacity:1}
  #splash{transition:none}
}
/* שדה קובץ עם display:none לא נפתח בחלק מהדפדפנים בנייד —
   מסתירים אותו ויזואלית אבל משאירים אותו בפריסה. */
.filein{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px;pointer-events:none}

/* ── בית בסגנון אפליקציית מוזיקה ── */
.home{max-width:1200px;margin:0 auto}
.hgreet{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--tungsten);margin-bottom:6px}
.home h1{font-family:var(--disp);font-size:clamp(28px,7vw,44px);line-height:1.1;margin:0 0 18px}
.searchbar{width:100%;display:flex;align-items:center;gap:10px;background:rgba(17,20,26,.78);border:1px solid rgba(255,255,255,.08);
  border-radius:12px;padding:13px 16px;color:var(--dim);font-size:15px;text-align:start;transition:.15s}
.searchbar:hover{border-color:var(--edge-2);color:var(--cream-2)}
.searchbar b{color:var(--tungsten);font-weight:400;font-family:var(--mono);font-size:13px}

.shelf{margin-top:30px}
.shelf-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.shelf-head h3{font-family:var(--disp);font-size:19px;margin:0}
.shelf-head span{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--dim)}
.shelf-head .more{margin-inline-start:auto;font-size:13px;color:var(--tungsten);background:none;border:0;padding:0}
.rail{display:flex;gap:13px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.card2{flex:0 0 138px;scroll-snap-align:start;background:none;border:0;padding:0;text-align:start;color:var(--cream)}
.art{width:138px;height:138px;border-radius:10px;display:grid;place-items:center;position:relative;
  overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.55)}
.art i{font-family:var(--disp);font-size:44px;font-style:normal;color:rgba(255,255,255,.9);
  text-shadow:0 2px 14px rgba(0,0,0,.5)}
.art.round{border-radius:50%}
.art.hasimg i{display:none}
.art.hasimg::after{background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.35))}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.14),transparent 55%)}
.card2 b{display:block;font-weight:500;font-size:14px;margin-top:9px;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card2 small{display:block;color:var(--dim);font-size:12px;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card2:hover .art{transform:translateY(-3px)}
.art{transition:transform .18s}
.badge{position:absolute;bottom:7px;inset-inline-start:7px;background:rgba(6,7,9,.72);
  font-family:var(--mono);font-size:9px;letter-spacing:.1em;padding:3px 7px;border-radius:4px;color:var(--cream)}

.addcard{background:#14171C;border:1px solid var(--edge);border-radius:12px;padding:16px;margin-top:26px}
.addcard h3{font-family:var(--disp);font-size:17px;margin:0 0 4px}
.addcard p{color:var(--cream-2);font-size:13px;margin:0 0 12px;line-height:1.6}
.quick{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}

/* ── שפה חזותית אחידה לכל המסכים ── */
.pills{display:flex;gap:9px;overflow-x:auto;padding:2px 0 4px;margin:18px 0 4px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;background:rgba(20,24,31,.82);border:1px solid rgba(255,255,255,.06);color:var(--cream-2);border-radius:999px;
  padding:9px 20px;font-size:15px;font-weight:500;transition:.15s;white-space:nowrap}
.pill:hover{background:#1D2027;color:var(--cream)}
.pill.on{background:var(--cream);color:#08090C}

.sec{margin-top:24px}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec-head h3{font-family:var(--disp);font-size:20px;margin:0}
.sec-head .all{margin-inline-start:auto;background:none;border:0;color:var(--cream-2);font-size:14px}
.sec-head .all:hover{color:var(--cream)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:11px}
.tile{display:flex;align-items:center;gap:11px;border-radius:13px;
  background:rgba(17,20,26,.72);border:1px solid rgba(255,255,255,.06);
  padding:9px;text-align:start;color:var(--cream);transition:.15s;min-width:0}
.tile:hover{background:rgba(30,36,46,.9);border-color:rgba(159,200,255,.22)}
.tile .art{width:54px;height:54px;flex:0 0 54px;border-radius:8px}
.tile .art.round{border-radius:50%}
.tile .art i{font-size:19px}

.tile b{display:block;font-weight:500;font-size:14.5px;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .go{margin-inline-start:auto;color:var(--dim);font-size:15px;flex:0 0 auto}

.hero-row{display:flex;align-items:center;gap:14px;margin-bottom:4px}
.hero-row h1{font-family:var(--disp);font-size:clamp(30px,8vw,44px);margin:0;line-height:1}
.hero-row .avatar{margin-inline-start:auto;width:42px;height:42px;border-radius:50%;
  background:#16181D;border:1px solid var(--edge);display:grid;place-items:center;
  color:var(--cream-2);font-size:17px;flex:0 0 42px}

/* המסכים הפנימיים מקבלים בדיוק את אותה שפה */
.gstep{grid-template-columns:44px 1fr;gap:14px;border-radius:14px;padding:18px;margin-bottom:11px;
  background:rgba(17,20,26,.78);border:1px solid rgba(255,255,255,.06)}
.panel{border-radius:14px;background:rgba(17,20,26,.80);border:1px solid rgba(255,255,255,.06)}
.catrow{background:rgba(17,20,26,.72);border:1px solid rgba(255,255,255,.06);border-radius:12px;
  padding:11px 13px;margin-bottom:8px}
.abcredit{background:#121417;border:0;border-inline-start:3px solid var(--tungsten);border-radius:13px}
.note{border-radius:10px;border-inline-start-width:3px}
.chipA{background:rgba(20,24,31,.82);border:1px solid rgba(255,255,255,.06);border-radius:999px;padding:9px 16px}
.chipA:hover{background:#1D2027}
.grouphead{border-bottom-color:var(--edge)}
.verbox{margin-top:11px;background:#0F1216;border:1px solid var(--edge);border-radius:10px;padding:10px}
.verbox > div{display:flex;gap:11px;align-items:center}
.verthumb{width:84px;height:47px;object-fit:cover;border-radius:6px;flex:0 0 84px}

/* ── רקעי מסכים: התמונה נראית, והטקסט נשאר קריא בזכות מסכה ממורכזת ── */

#pageBg.on{opacity:1}

/* ── מסך מלא: הווידאו ממלא את כל הגובה שנשאר, הפס יושב למטה ── */
body.fs{overflow:hidden}
body.fs .top,body.fs #pageBg{display:none}
body.fs .wrap{padding:0;max-width:none;height:100dvh;overflow:hidden}
body.fs{padding-bottom:0}
body.fs .main{grid-template-columns:1fr;gap:0;height:100%}
body.fs .main > div{height:100%;display:flex;flex-direction:column}
body.fs .main > div > *:not(.stickytop){display:none}
body.fs .stickytop{position:static;padding:0;box-shadow:none;flex:1;min-height:0;
  display:flex;flex-direction:column}
/* הווידאו נמתח לכל הגובה הפנוי במקום יחס קבוע */
body.fs .ytbox{padding-top:0;flex:1;min-height:0;border-radius:0;border:0;background:#000}
body.fs .horizon{flex:0 0 auto;height:min(42vh,300px);border-radius:0;border-inline:0;
  border-bottom:0;margin:0}
body.fs .horizon .nowdgm{width:min(48vw,250px);top:0;bottom:0;height:auto;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(270deg,rgba(10,12,16,.97) 66%,rgba(10,12,16,0));
  padding-inline-start:10px}
body.fs .horizon .nowdgm svg{height:min(38vh,270px);width:auto;max-width:none}
body.fs .horizon .nowline{right:min(49vw,256px)}
body.fs .horizon .nowcap{right:calc(min(49vw,256px) + 14px)}
body.fs .hchip{top:14%;height:46%;font-size:clamp(24px,7vw,44px)}
body.fs .hzbeats{bottom:8px;left:14px}
body.fs .hzbeats i{width:26px;height:5px}
#fsExit{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);inset-inline-start:12px;z-index:140;
  opacity:0;pointer-events:none;transition:opacity .25s;
  background:rgba(6,7,9,.72);border:1px solid #34404F;color:#CFE0F5;font-weight:600;
  border-radius:999px;padding:9px 18px}
#fsExit.show{opacity:1;pointer-events:auto}
/* ── מסך ההדגמה: פריים לכל אקורד, מיזוג ביניהם ── */
body.demo #pageBg{display:none}
.demoWrap{display:flex;flex-direction:column;height:calc(100dvh - var(--topH,52px));
  margin:-16px -14px 0;background:#05060A}
.demoStage{position:relative;flex:1;min-height:0;display:grid;place-items:center;overflow:hidden}
.demoFrame{position:absolute;max-width:100%;max-height:100%;width:auto;height:100%;
  object-fit:contain;display:block;transform-origin:58% 42%;will-change:transform,opacity;
  image-rendering:auto}
#demoB{opacity:0;transition:opacity .06s linear}
.demoGlow{position:absolute;inset:0;pointer-events:none;opacity:.12;
  background:radial-gradient(52% 40% at 66% 40%, rgba(160,235,255,.5), transparent 62%)}
.demoTag{position:absolute;top:10px;inset-inline-start:14px;font-family:var(--disp);
  font-size:clamp(26px,7vw,44px);color:var(--tungsten);
  text-shadow:0 0 26px rgba(245,178,74,.5),0 3px 12px rgba(0,0,0,.9);pointer-events:none}
.demoBar{flex:0 0 auto;background:rgba(6,7,10,.96);border-top:1px solid var(--edge);
  padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.demoBar .horizon{height:118px;margin:0 0 8px}
.demoCtl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demoCtl .stamp{margin-inline-start:auto;color:var(--cream-2)}
@media(min-width:900px){ .demoBar .horizon{height:132px} }
.toast{position:fixed;bottom:16px;inset-inline-start:16px;background:#1A1E25;
  border:1px solid var(--tungsten-d);color:var(--tungsten);padding:10px 15px;border-radius:5px;
  z-index:95;font-size:14px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.big{position:fixed;inset:0;background:rgba(6,7,9,.95);backdrop-filter:blur(4px);z-index:80;display:grid;place-items:center;
  text-align:center;padding:20px}
.big[hidden]{display:none}
.big .k{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--tungsten);text-transform:uppercase}
.big .v{font-family:var(--disp);font-size:clamp(64px,19vw,160px);line-height:1;margin:12px 0;
  color:var(--cream);text-shadow:0 0 44px rgba(240,168,60,.28)}
.big .h{color:var(--cream-2);font-size:15px;line-height:1.8;max-width:440px;margin:0 auto}
.big .h b{color:var(--tungsten)}
.hidden{display:none !important}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>

<script>

/* ═══════════════════════════════════════════════════════════════
   ייבוא מספר אקורדים אישי (PDF)
   הקובץ נקרא בדפדפן בלבד — הוא לא נשלח לשום מקום ולא נשמר בפרויקט.
   נשמר מקומית רק אינדקס קל: שם שיר, אמן ומספר עמוד.
   ═══════════════════════════════════════════════════════════════ */
const ytSearch = (a,t) => "https://www.youtube.com/results?search_query=" +
  encodeURIComponent(((a?a+" ":"") + t).trim());
const BOOK_KEY = "playalong-book-index-v1";
let pdfDoc = null, bookIndex = null, bookPick = null, bookRtl = true;

function bookStored(){                      /* קיים באחסון? לא תלוי במשתנה */
  try{ const r=localStorage.getItem(BOOK_KEY); return r ? (JSON.parse(r)||[]).length : 0; }
  catch(e){ return 0; }
}
function bookDrop(){
  const n = bookStored();
  if(!n){ toast("אין ספר מיובא"); return false; }
  if(!confirm(`להסיר ${n} שירים מהספר המיובא?\nהשירים ששמרת בעצמך לא ייפגעו.`)) return false;
  localStorage.removeItem(BOOK_KEY);
  bookIndex = null; bookArtist = null; pdfDoc = null;
  invalidateItems();
  toast("הספר הוסר");
  return true;
}
function bookLoad(){ try{ return JSON.parse(localStorage.getItem(BOOK_KEY)||"null"); }catch(e){ return null; } }
function bookSave(idx){
  invalidateItems();
  try{ localStorage.setItem(BOOK_KEY, JSON.stringify(idx)); return true; }
  catch(e){
    /* אם אין מקום לאקורדים — שומרים לפחות את האינדקס */
    try{
      localStorage.setItem(BOOK_KEY, JSON.stringify(idx.map(x=>({t:x.t,a:x.a,p:x.p}))));
      toast("נשמר אינדקס בלבד — לשליפת אקורדים יידרש הקובץ שוב");
    }catch(e2){ toast("אין מקום לשמירה מקומית — האינדקס יישאר לסשן הזה"); }
    return false;
  }
}

function loadPdfJs(){
  return new Promise((res, rej)=>{
    if(window.pdfjsLib) return res();
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    sc.onload = ()=>{
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      res();
    };
    sc.onerror = ()=>rej(new Error("pdfjs"));
    document.head.appendChild(sc);
  });
}

/* תווי כיווניות נסתרים שוברים כל זיהוי — מנקים אותם ראשונים */
const stripBidi = t => String(t).replace(/[\u200E\u200F\u202A-\u202E\u2066-\u2069]/g, "");

/* איסוף פריטי טקסט לשורות לפי מיקום אנכי, וסידור כל שורה משמאל לימין */
async function pageLines(pageNo){
  const page = await pdfDoc.getPage(pageNo);
  const tc = await page.getTextContent();
  const rows = new Map();
  tc.items.forEach(it=>{
    const s = stripBidi(it.str);
    if(!s.trim()) return;
    const y = Math.round(it.transform[5]);
    const key = Math.round(y/3)*3;
    if(!rows.has(key)) rows.set(key, []);
    rows.get(key).push({x: it.transform[4], s});
  });
  return [...rows.entries()]
    .sort((a,b)=> b[0]-a[0])
    .map(([,items]) => items.sort((a,b)=>a.x-b.x).map(i=>i.s).join(" ").replace(/\s+/g," ").trim())
    .filter(Boolean);
}

/* שורת הכותרת בספר מכילה שם שיר ואמן משני צדי מקף.
   איזה צד הוא מה תלוי בכיוון החילוץ, ולכן לא מחליטים כאן — מחזירים שניים. */
function parseHead(line){
  const m = String(line).split(/\s*[-\u2013\u2014]\s*/).map(x=>x.trim()).filter(Boolean);
  if(m.length >= 2) return [m[0], m.slice(1).join(" - ")];
  return [String(line).trim(), ""];
}
/* הכרעה סטטיסטית: שם אמן חוזר על פני שירים רבים, שם שיר כמעט ייחודי.
   הצד עם פחות ערכים שונים הוא האמן. */
function decideSides(pairs){
  const A=new Set(), B=new Set();
  pairs.forEach(([a,b])=>{ if(a) A.add(a); if(b) B.add(b); });
  if(!B.size) return false;
  return A.size < B.size;      // true = הצד הראשון הוא האמן
}

async function buildBookIndex(file, onProg){
  await loadPdfJs();
  const buf = await file.arrayBuffer();
  pdfDoc = await window.pdfjsLib.getDocument({data: buf}).promise;
  const n = pdfDoc.numPages;
  const idx = [];
  for(let p=1; p<=n; p++){
    const lines = await pageLines(p);
    if(lines.length >= 3){
      const chordy = lines.filter(L=>{
        const t = L.split(/[\s|,]+/).filter(Boolean);
        const h = t.filter(isChordToken);
        return h.length && h.length >= t.length*0.6;
      }).length;
      if(chordy >= 2){
        const h = parseHead(lines[0]);
        if(h[0] && h[0].length < 90){
          const rows = [];
          lines.forEach(L=>{
            const tk = L.split(/[\s|,]+/).filter(Boolean);
            const hits = tk.filter(isChordToken);
            if(hits.length && hits.length >= tk.length*0.6){
              const row = hits.map(baseOf).filter(Boolean);
              if(row.length) rows.push(row);
            }
          });
          /* הסדר בספרים בעברית הפוך — נשמר כפי שחולץ, וההיפוך בטעינה */
          idx.push({h0:h[0], h1:h[1], p, c: rows.flat().join(" ")});
        }
      }
    }
    if(p % 10 === 0){ onProg(p, n); await new Promise(r=>setTimeout(r,0)); }
  }
  onProg(n, n);
  /* עכשיו, עם כל הזוגות ביד, אפשר להכריע איזה צד הוא האמן */
  const artistFirst = decideSides(idx.map(x=>[x.h0, x.h1]));
  return idx.map(x=>({
    t: artistFirst ? (x.h1 || x.h0) : x.h0,
    a: artistFirst ? x.h0 : (x.h1 || ""),
    p: x.p, c: x.c
  }));
}

async function bookChords(pageNo){
  const lines = await pageLines(pageNo);
  const out = [];
  lines.forEach(L=>{
    const t = L.split(/[\s|,]+/).filter(Boolean);
    const hits = t.filter(isChordToken);
    if(hits.length && hits.length >= t.length*0.6){
      const row = hits.map(baseOf).filter(Boolean);
      if(row.length) out.push(bookRtl ? [...row].reverse() : row);
    }
  });
  return out.flat();
}

/* ---------- מסך ---------- */
let bookBusy = false;

function renderImport(){
  setTimeout(resetTop,0);
  $("ttl").textContent = "ספר אקורדים";
  $("topRight").innerHTML = navBar(`<button class="btn sm" data-nav="settings">← הגדרות</button>`);

  bookIndex = bookIndex || bookLoad();
  const withC = (bookIndex||[]).filter(x=>x.c).length;

  app.innerHTML = `
  <div class="guide">
    <div class="hero-row"><h1>ספר אקורדים</h1></div>

async function bookApply(){
  if(bookBusy) return;
  bookBusy = true;
  try{
    /* אקורדים שנשמרו בסריקה — הקובץ כבר לא נחוץ */
    let chords;
    if(bookPick.c){
      chords = bookPick.c.split(" ").filter(Boolean);
      if(bookRtl) chords = chords.reverse();
    } else {
      chords = await bookChords(bookPick.p);
    }
    if(!chords.length){ toast("לא זוהו אקורדים בעמוד הזה"); return; }
    const ok = confirm(
      `${bookPick.t} — ${bookPick.a}\nעמוד ${bookPick.p}\n\n` +
      `זוהו ${chords.length} אקורדים.\nהתחלה: ${chords.slice(0,8).join("  ")}\n\n` +
      `לטעון ללוח?\n(אם הסדר יוצא הפוך — בטל, שנה את מתג הכיוון ונסה שוב)`);
    if(!ok) return;
    S = newSong();
    S.title = bookPick.a ? bookPick.a+" — "+bookPick.t : bookPick.t;
    S.bars = chords.map(c=>{
      const p = parseChord(c);
      return {c: p ? PC_SHARP[p.pc]+p.q : null};
    });
    while(S.bars.length < 64) S.bars.push({c:null});
    gridOpen = true;
    mode = "main"; ready=false; player=null; songDur=0; adOn=false; holdSync=false;
    cur={bar:-1,beat:-1,line:-1};
    S.ytId = "";
    open_();
    toast(`${chords.length} אקורדים נטענו — חבר קישור וכייל`);
  }catch(e){
    console.error(e); toast("שליפת העמוד נכשלה");
  }finally{ bookBusy = false; }
}

function expandSong(entry){
  const bars = [];
  const marks = [];
  entry.arr.forEach(([name, times]) => {
    const prog = entry.sec[name];
    if(!prog) return;
    for(let r=0; r<times; r++){
      marks.push({name, bar:bars.length});
      prog.forEach(c => bars.push({c: c==="-" ? null : c}));
    }
  });
  while(bars.length < (entry.blank || 32)) bars.push({c:null});
  return {bars, marks};
}

  const m = new Map();

    const a = (artistOf(x) || "ללא אמן").trim();
    if(!m.has(a)) m.set(a, []);
    m.get(a).push(x);
  });
  const out = [...m.entries()];
  return noSort ? out : out.sort((x,y)=>heCmp(x[0], y[0]));
}
/* בספרייה הכותרת נשמרת כ־«אמן — שיר»; מפרידים בחזרה */
function splitTitle(t){
  const i = String(t).indexOf(" — ");
  return i > 0 ? {a: t.slice(0,i), t: t.slice(i+3)} : {a: "", t: String(t)};
}

   נשלח שם האמן בלבד. אפשר לכבות בהגדרות, ואז חוזרים לעטיפה הנוצרת מהשם.
   ═══════════════════════════════════════════════════════════════ */
const ART_KEY="playalong-art-v1", ART_SET="playalong-art-on";
let artCache=null;
function artLoad(){ if(artCache) return artCache;
  try{ artCache=JSON.parse(localStorage.getItem(ART_KEY)||"{}"); }catch(e){ artCache={}; }
  return artCache; }
function artStore(){ try{ localStorage.setItem(ART_KEY, JSON.stringify(artCache||{})); }catch(e){} }
function artEnabled(){ return localStorage.getItem(ART_SET)!=="0"; }
function artSetEnabled(v){ localStorage.setItem(ART_SET, v?"1":"0"); }

async function fetchArt(name){
  const c=artLoad();
  if(name in c) return c[name] || null;
  try{
    const r=await fetch("https://itunes.apple.com/search?limit=1&entity=album&term="+
      encodeURIComponent(name));
    if(r.status===403 || r.status===429) return null;      // מגבלת קצב — לא לשמור ככישלון
    if(!r.ok) return null;
    const d=await r.json();
    const u=d.results && d.results[0] && d.results[0].artworkUrl100;
    c[name] = u ? u.replace(/100x100bb/,"300x300bb") : "";  // רק תשובה אמיתית נשמרת
    artStore();
    return c[name] || null;
  }catch(e){ return null; }                                 // תקלת רשת — ננסה שוב בפעם הבאה
}

/* מילוי עצל: רק אמנים שנראים על המסך, שניים במקביל ובקצב מתון —
   רשימה של מאות אמנים בבת אחת מגיעה למגבלת הקצב של השירות. */
let artQueue=[], artBusy=0, artObs=null;
function paintArt(){
  if(!artEnabled()) return;
  if(!artObs && "IntersectionObserver" in window){
    artObs = new IntersectionObserver(es=>{
      es.forEach(e=>{
        if(!e.isIntersecting) return;
        artObs.unobserve(e.target);
        if(e.target.dataset.q) return;
        e.target.dataset.q="1"; artQueue.push(e.target); pumpArt();
      });
    }, {rootMargin:"250px"});
  }
  document.querySelectorAll(".art[data-artist]").forEach(el=>{
    if(el.dataset.q || el.classList.contains("hasimg")) return;
    if(artObs) artObs.observe(el);
    else { el.dataset.q="1"; artQueue.push(el); }
  });
  if(!artObs) pumpArt();
}
function pumpArt(){
  while(artBusy<2 && artQueue.length){
    const el=artQueue.shift(); artBusy++;
    fetchArt(el.dataset.artist).then(u=>{
      if(u && el.isConnected){
        el.style.backgroundImage=`url("${u}")`;
        el.style.backgroundSize="cover";
        el.style.backgroundPosition="center";
        el.classList.add("hasimg");
      } else if(el.isConnected){
        delete el.dataset.q;          // לא נמצא כרגע — יינתן ניסיון נוסף
      }
    }).finally(()=>{ artBusy--; setTimeout(pumpArt, 90); });
  }
}

function hashOf(str){
  let h = 2166136261;
  for(let i=0;i<String(str).length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return Math.abs(h);
}
function artStyle(name){
  const h = hashOf(name||"?");
  const a = h % 360, b = (a + 40 + (h>>8)%70) % 360;
  const s1 = 46 + (h>>4)%22, l1 = 26 + (h>>12)%12;
  return `background:linear-gradient(145deg,hsl(${a} ${s1}% ${l1}%),hsl(${b} ${s1-8}% ${Math.max(12,l1-12)}%))`;
}

/* ═══════════════════════════════════════════════════════════════
   מסלול האקורדים הנע — אלמנט החתימה.
   כל אקורד הוא בלוק שרוחבו כאורכו בפועל, והוא נע לעבר קו ההווה.
   הכול נגזר מאותו שעון: אין אנימציית CSS עצמאית שיכולה להתפצל.
   ═══════════════════════════════════════════════════════════════ */
const HZ_LOOK = 9;              // שניות קדימה שנראות במסלול
/* מיקום קו ההווה נמדד מהמסך עצמו במקום להיות מקובע —
   כך הפס מתיישר נכון גם במסך רגיל, גם בנייד וגם במסך מלא. */
function hzNowX(){
  const lane = $("hzLane");
  const line = lane && lane.parentElement && lane.parentElement.querySelector(".nowline");
  if(lane && line){
    const lr = lane.getBoundingClientRect(), nr = line.getBoundingClientRect();
    const d = lr.right - nr.right;
    if(d > 20 && d < lr.width*0.8) return d;
  }
  return narrow() ? 90 : 96;
}
let hzPool = [];

function paintHorizon(now){
  const lane = $("hzLane");
  if(!lane){ hzPool = []; return; }
  const W = lane.clientWidth;
  if(W < 40) return;
  const NOWX = hzNowX();
  const span = W - NOWX - 8;
  const bi = Math.max(0, cur.bar);
  handFrame(bi, now);

  /* שיר שנטען בלי אקורדים (למשל מהערכים הישראליים) — הפס מסביר במקום להיראות שבור */
  const empty = !S.bars.some(b=>b.c);
  const eh = $("hzEmpty");
  if(eh) eh.classList.toggle("hidden", !empty);
  if(empty){ hzPool.forEach(el=>el.style.display="none"); return; }

  /* איחוד מידות רצופות בעלות אותו אקורד לבלוק אחד */
  const blocks = [];
  let i = bi;
  while(i < S.bars.length){
    const t0 = timeOfBar(i);
    if(t0 > now + HZ_LOOK) break;
    const c = chordAt(i);
    let j = i + 1;
    /* מידות ריקות לא מתאחדות לבלוק אחד ענק — משאירים חלוקה נראית */
    const cap = c ? S.bars.length : i + 2;
    while(j < S.bars.length && j < cap && chordAt(j) === c && timeOfBar(j) <= now + HZ_LOOK) j++;
    blocks.push({c, t0, t1: timeOfBar(j)});
    i = j;
    if(blocks.length >= 14) break;
  }

  while(hzPool.length < blocks.length){
    const d = document.createElement("div");
    d.className = "hchip";
    lane.appendChild(d);
    hzPool.push(d);
  }

  blocks.forEach((b, k) => {
    const el = hzPool[k];
    const d0 = (b.t0 - now) / HZ_LOOK * span;
    const d1 = (b.t1 - now) / HZ_LOOK * span;
    const right = NOWX + Math.max(d0, -NOWX + 2);
    const w = Math.max(26, d1 - Math.max(d0, -NOWX + 2));
    el.style.right = right + "px";
    el.style.width = Math.min(w, span + NOWX) + "px";
    el.style.display = "flex";
    const hot = d0 <= 0 && d1 > 0 && !!b.c;
    el.className = "hchip" + (hot ? " hot" : "") + (b.c ? "" : " silent");
    const txt = b.c || "·";
    if(el.textContent !== txt) el.textContent = txt;
  });
  for(let k = blocks.length; k < hzPool.length; k++) hzPool[k].style.display = "none";
}

  if(!host) return;
  if(mode === "demo"){
    host.classList.add("behind");
    host.style.left="0px"; host.style.top="0px";
    host.style.width="100vw"; host.style.height="100vh";
    return;
  }
  host.classList.remove("behind");
  const slot = document.getElementById("ytSlot");
  if(!slot || mode!=="main"){ host.style.width="0px"; host.style.height="0px"; return; }
  const r = slot.getBoundingClientRect();
  host.style.left = Math.round(r.left)+"px";
  host.style.top  = Math.round(r.top)+"px";
  host.style.width  = Math.round(r.width)+"px";
  host.style.height = Math.round(r.height)+"px";
}
function syncTopH(){
  const t = document.querySelector(".top");
  if(t) document.documentElement.style.setProperty("--topH", Math.round(t.getBoundingClientRect().height)+"px");
  syncPlayerBox();
}
window.addEventListener("orientationchange", ()=>{ setTimeout(syncTopH,300); setTimeout(syncTopH,700); });
let scT; window.addEventListener("scroll", ()=>{ clearTimeout(scT); scT=setTimeout(syncTopH,120); }, {passive:true});
if(window.visualViewport) window.visualViewport.addEventListener("resize", ()=>syncTopH());
let wasNarrow = narrow(), rzT;
window.addEventListener("resize", ()=>{
  clearTimeout(rzT);
  rzT = setTimeout(()=>{
    const n = narrow();
    syncTopH();
    if(n !== wasNarrow){ wasNarrow = n; if(mode==="main"){ renderMain(); paint(true); } }
  }, 220);
});

        </ul>
        <div class="note rust"><strong>שמור על ההפרדה:</strong> ספרי אקורדים מסמנים לרוב «לשימוש אישי בלבד». השימוש הזה — ספרייה במכשיר שלך — הוא בדיוק המסגרת שהם מתירים. אל תעלה את הקובץ עצמו לריפו, גם לא פרטי, וגם לא את הספרייה שנוצרה ממנו.</div>
      </div>
    </div>

    <div class="gstep">
      <div class="gnum">4</div>
      <div>
        <h3>מילים — שתי דרכים</h3>
        <p><b>הדרך הקצרה: מצב קליפ מילים.</b> אם בחרת קליפ שהמילים כבר מוצגות בו על המסך, לחץ <b>מצב קליפ מילים</b> בשורת הבקרה. הווידאו יגדל, מסלול האקורדים ולוח האקורדים ייערכו ישר מתחתיו, ושלב יישור המילים נמחק לגמרי — נשאר רק לכייל את רשת המידות.</p>
        <div class="note sage"><strong>למה זה עדיף:</strong> המילים בקליפ כבר מסונכרנות בידי מי שהעלה אותו, ואתה חוסך גם את ההדבקה וגם את היישור. החיסרון היחיד — צריך להסתכל על המסך, ולכן העיצוב במצב הזה מרכז את הווידאו והאקורדים במקום אחד.</div>
        <p style="margin-top:14px"><b>הדרך השנייה: המילים שלך.</b> שימושי כשאין קליפ מילים טוב, כשאתה רוצה גרסה מסוימת, או כשאתה מנגן מהטלפון ורוצה טקסט גדול.</p>
        <p>הדבק את מילות השיר בתיבה — שורה אחת בכל שורה — ולחץ <b>טעינה</b>. אחר כך <b>יישור שורות</b>: השיר מתנגן, ואתה מקיש <kbd>רווח</kbd> ברגע שכל שורה מתחילה להישמע.</p>
        <p>מרגע שהשורות מיושרות, האקורדים של כל שורה מופיעים <b>מעליה</b> אוטומטית — נגזרים מרשת המידות, לא מוקלדים בנפרד. השורה הפעילה מודגשת וגוללת מעצמה.</p>
        <p>בתיבה הריקה יש קישורי חיפוש ל-<b>Genius</b>, <b>Musixmatch</b> וחיפוש כללי, מותאמים אוטומטית לשם השיר שנטען — נפתחים בלשונית חדשה, מעתיקים משם ומדביקים.</p>
        <div class="note"><strong>למה המילים לא מגיעות מהאפליקציה:</strong> מילות שיר מוגנות בזכויות יוצרים. אתה מדביק את הגרסה שלך, והיא נשמרת מקומית במכשיר שלך בלבד.</div>
      </div>
    </div>

    <div class="gstep">
      <div class="gnum">5</div>
      <div>
        <h3>ניגון ותרגול</h3>
        <ul>
          <li><b>דיאגרמת האצבעות</b> מציירת יד ממש: כף יד, אצבעות שמתעקלות מהפרקים אל המיתר, וברה כאצבע שוכבת. המספר על קצה כל אצבע אומר באיזו אצבע ללחוץ — 1 מורה, 4 זרת.</li>
          <li><b>מסלול האקורדים</b> בראש המסך — האקורדים הבאים נעים לעבר קו ההווה, וכל בלוק ברוחב אורכו בפועל. זה נותן לך את ההתראה שהאצבעות צריכות, לפני שהאקורד מגיע.</li>
          <li><b>מהירות 50% או 75%</b> — יוטיוב שומר על הגובה, כך שהשיר איטי אבל באותו סולם.</li>
          <li><b>טונים ±6</b> — מזיז את האקורדים המוצגים כדי לנגן בסולם נוח. שים לב: זה משנה את מה שכתוב, לא את מה שנשמע.</li>
          <li><b>הצעת קאפו</b> מופיעה מעל הלוח כשיש קאפו שהופך את רוב האקורדים לפתוחים — הדרך לעקוף ברה.</li>
          <li>לחיצה על מידה או על שורת מילים <b>קופצת לשם</b> בשיר.</li>

    <div class="gstep">

      <div>
        <h3>בטלפון</h3>
        <p>במסך צר הפריסה משתנה מעצמה: <b>הווידאו ופס האקורדים ננעלים לראש המסך</b>, וכל השאר — לוח המידות, הבקרות, ההגדרות — נגלל מתחתיהם. אפשר לגלול לתקן אקורד בלי לאבד את הווידאו מהעין.</p>
        <p><b>לוח המידות מקופל בנייד</b> כברירת מחדל, כדי שלא ידחוף את הנגן. פתח אותו רק כשצריך לתקן אקורד, וסגור אחר כך.</p>
        <p>בנייד הבלוק הגדול של האקורד יורד לגמרי — <b>הכול מרוכז בפס אחד</b>: האקורד הנוכחי דולק על קו ההווה, הבאים זורמים לעברו, דיאגרמת האצבעות בקצה הפס, ונקודות הפעמה בתחתיתו. פחות מסך, יותר מידע במבט אחד.</p>
        <ul>
          <li>עם <b>קליפ מילים</b> אתה מקבל מילים ואקורדים באותו מבט — בלי לגלול בכלל.</li>

          <li>הנח את הטלפון על סטנד במרחק זרוע. הגופנים מוגדלים בהתאם.</li>

        <p>כשיוטיוב מכניס פרסומת, השעון שהאפליקציה קוראת הוא של הפרסומת — והאקורדים מתחילים לזוז לחינם. האפליקציה <b>מזהה את זה לבד ומקפיאה</b>: בזמן פרסומת יוטיוב מדווח על אורך קצר בהרבה מאורך השיר, וזה הסימן. על הפס מופיע «פרסומת · הסנכרון יחזור לבד», והכול חוזר מעצמו כשהשיר מתחיל.</p>
        <p>יש גם <b>הקפא סנכרון</b> ידני בשורת הבקרה — לכל מצב שבו אתה רוצה שהאקורדים יעמדו במקום: פרסומת שלא זוהתה, שיחת טלפון, או סתם רגע להסתכל על האצבעות.</p>
        <div class="note"><strong>מקרה קצה יחיד:</strong> פרסומת שמתחילה לפני שהנגן הספיק לדווח את אורך השיר לא תזוהה. אז פשוט לחץ על ההקפאה הידנית.</div>

/* ═══════════════════════════════════════════════════════════════
   1. רשת המידות — לינארית למקטעים בין עוגנים
   ═══════════════════════════════════════════════════════════════ */
/* שיערוך משך מידה בריבועים פחותים על כל העוגנים.
   הקשה אנושית מדויקת בערך ל-30 מילישניות; שימוש בשני העוגנים
   האחרונים בלבד מגביר את הרעש פי כמה ומייצר סחיפה בסוף השיר.
   התאמה גלובלית ממצעת את הרעידה ומחזירה את הטמפו האמיתי. */
function fitBarDur(){
  const a=S.anchors, n=a.length;
  if(n<2) return 2;
  let sx=0, sy=0, sxx=0, sxy=0;
  for(const p of a){ sx+=p.bar; sy+=p.t; sxx+=p.bar*p.bar; sxy+=p.bar*p.t; }
  const d=n*sxx-sx*sx;
  if(Math.abs(d)<1e-9) return 2;
  const slope=(n*sxy-sx*sy)/d;
  return slope>0.05 ? slope : 2;
}
function barDur(){ return fitBarDur(); }
function timeOfBar(i){
  const a=S.anchors;
  if(!a.length) return i*barDur();
  if(a.length===1) return a[0].t + (i-a[0].bar)*barDur();
  if(i<=a[0].bar) return a[0].t - (a[0].bar-i)*barDur();
  for(let k=0;k<a.length-1;k++){
    if(i>=a[k].bar && i<=a[k+1].bar){
      const span=a[k+1].bar-a[k].bar;
      return a[k].t + (i-a[k].bar)*((a[k+1].t-a[k].t)/span);
    }
  }
  const last=a[a.length-1];
  return last.t + (i-last.bar)*barDur();
}
function barAtTime(t){
  const n=S.bars.length; if(!n) return -1;
  let lo=0, hi=n-1, r=-1;
  while(lo<=hi){ const m=(lo+hi)>>1;
    if(timeOfBar(m)<=t){ r=m; lo=m+1; } else hi=m-1; }
  return r;
}
function addAnchor(bar,t){
  S.anchors = S.anchors.filter(a=>a.bar!==bar);
  S.anchors.push({bar,t});
  S.anchors.sort((a,b)=>a.bar-b.bar);
}
function bpmNow(){
  const d=barDur(); return d>0 ? Math.round(60/(d/S.beatsPerBar)) : 0;
}

/* ═══════════════════════════════════════════════════════════════
   2. אקורדים
   ═══════════════════════════════════════════════════════════════ */
function parseChord(txt){
  const m=String(txt).trim().match(/^([A-Ga-g][#b]?)(m|min)?$/);
  if(!m) return null;
  let root=m[1][0].toUpperCase()+(m[1][1]||"");
  root=ALIAS[root]||root;
  const pc=PC_SHARP.indexOf(root);
  if(pc<0) return null;
  return {pc, q:m[2]?"m":""};
}
function shift(c){
  if(!c) return null;
  const p=parseChord(c); if(!p) return c;
  const pc=((p.pc+S.transpose)%12+12)%12;
  return (S.flats?PC_FLAT:PC_SHARP)[pc]+p.q;
}
function chordAt(i){ const b=S.bars[i]; return b&&b.c ? shift(b.c) : null; }
function nextChordFrom(i){
  const c=chordAt(i);
  for(let k=i+1;k<S.bars.length;k++){ const n=chordAt(k); if(n && n!==c) return {c:n, bar:k}; }
  return null;
}
function shapeOf(name){
  if(!name) return null;
  const p=parseChord(name); if(!p) return null;
  return SHAPES[PC_SHARP[p.pc]+p.q]||null;
}
function suggestCapo(){
  const used=[...new Set(S.bars.map(b=>b.c).filter(Boolean))];
  if(!used.length) return null;
  let best=null;
  for(let cap=0; cap<=7; cap++){
    let n=0;
    used.forEach(c=>{ const p=parseChord(c); if(!p) return;
      const pc=((p.pc+S.transpose-cap)%12+12)%12;
      if(OPEN.has(PC_SHARP[pc]+p.q)) n++; });
    if(!best || n>best.n) best={cap,n,total:used.length};
  }
  return (best && best.cap>0 && best.n>best.total*0.6) ? best : null;
}

/* ═══════════════════════════════════════════════════════════════
   יד על הצוואר — מצב אחד, שרטוט אחד, ומעבר מונפש בין אקורדים.
   הצוואר מוצג מסובב 90°: האגוז מימין, מיתרים אופקיים, נמוך למעלה.
   כשעוברים אקורד, קצות האצבעות והחלון על הצוואר נעים בהינף אחד —
   וזה בדיוק מה שמלמד את המעבר. משך התנועה מתארך כשמאטים את השיר.
   ═══════════════════════════════════════════════════════════════ */
function chordState(name){
  const sh = shapeOf(name);
  if(!sh) return null;
  const nums = sh.f.split("").map(c => c==="x" ? -1 : parseInt(c,36));
  const fing = (sh.g||"------").split("");
  const played = nums.filter(n=>n>0);
  const minF = played.length?Math.min(...played):1, maxF = played.length?Math.max(...played):4;
  const base = (maxF<=4)?1:minF;
  const tips = {};
  for(let i=0;i<6;i++){
    const n = nums[i]; if(n<=0) continue;
    const f = fing[i]==="-" ? 0 : parseInt(fing[i],10)||0;
    if(!f) continue;
    if(!tips[f] || n < tips[f].fret) tips[f] = {fret:n, str:i};
  }
  const F = {};
  for(let f=1; f<=4; f++){
    F[f] = tips[f] ? {fret:tips[f].fret, str:tips[f].str, down:1}
                   : {fret: base + (f-1)*0.85 + 0.5, str: 6.5, down:0};   // מרחפת בהמתנה
  }
  return { base, F, nums, barre: sh.b || null, name };
}
const lerp = (a,b,u) => a + (b-a)*u;
function lerpState(a, b, u, sp){
  if(!a) return b;
  if(!b) return a;
  const F = {};
  for(let f=1; f<=4; f++){
    const A=a.F[f], B=b.F[f];
    /* אצבע ציר — נשארת במקומה בין שני האקורדים. זה מה שגיטריסט מחפש. */
    const pivot = A.down>0.5 && B.down>0.5 &&
                  Math.abs(A.fret-B.fret)<0.01 && Math.abs(A.str-B.str)<0.01;
    /* היסט מדורג: לא כל האצבעות יוצאות יחד */
    const off = 0.075*(f-1);
    const uf = Math.max(0, Math.min(1, (u - off) / (1 - 0.075*3)));
    const moves = !pivot && (Math.abs(A.fret-B.fret)>0.01 || Math.abs(A.str-B.str)>0.01
                             || Math.abs(A.down-B.down)>0.01);
    /* הרמה: האצבע עולה מהמיתר, נעה באוויר ונוחתת — לא מחליקה על הלוח */
    const lift = moves ? Math.sin(Math.PI*uf) : 0;
    F[f] = { fret: lerp(A.fret, B.fret, uf),
             str:  lerp(A.str,  B.str,  uf) + lift*0.42,
             down: Math.min(lerp(A.down, B.down, uf), 1 - lift*0.75),
             pivot, lift };
  }
  return { base: lerp(a.base, b.base, u), F,
           nums: u<0.5?a.nums:b.nums, barre: u<0.5?a.barre:b.barre,
           name: u<0.5?a.name:b.name,
           bAlpha: a.barre&&b.barre ? 1 : (a.barre ? 1-u : (b.barre ? u : 0)) };
}

function handSVG(st, W, withHand){
  const BH = W*1.24;
  const OW = BH, OH = withHand ? W*1.42 : W;
  if(!st) return `<svg class="dgm" width="${OW}" height="${OH}"></svg>`;
  const L=W*0.17, T=W*0.19, sp=(W-2*L)/5, fh=(BH-T-W*0.14)/5;
  const x = f => BH - (T + (f - st.base + 0.5)*fh);     // מיקום סריג מוחלט
  const y = i => L + i*sp;                              // מיקום מיתר
  const uid = Math.round(W)+(withHand?"h":"c");
  const skin = `url(#sk${uid})`;

  let s = `<defs>
    <linearGradient id="sk${uid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8E7CE"/><stop offset=".45" stop-color="#E2BE96"/>
      <stop offset="1" stop-color="#B0864F"/></linearGradient>
    <linearGradient id="nl${uid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3E2"/><stop offset="1" stop-color="#E9CBA4"/></linearGradient>
    <clipPath id="bd${uid}"><rect x="${x(st.base+4.5)}" y="${y(0)-sp*0.55}"
      width="${fh*5.2}" height="${sp*6.1}"/></clipPath>
  </defs>`;

  /* ---- האגודל, מאחורי הצוואר ----
     משורטט לפני הלוח: הלוח מסתיר את רובו ורק קצהו מציץ מעל המיתר
     הנמוך, בדיוק כמו אגודל שאוחז בצוואר מאחור. */
  if(withHand){
    const fwT = W*0.084;
    const kxT = f => x(st.base + 0.4 + (f-1)*0.95);
    const tipX = x(st.base + 1.30), tipY = y(0) - sp*1.05;
    s += `<path d="M ${kxT(3)-fwT*1.3} ${OH-2}
                   Q ${kxT(3)-fwT*2.4} ${OH*0.50} ${tipX-fwT*1.05} ${tipY+sp*0.40}
                   Q ${tipX-fwT*0.15} ${tipY-fwT*0.80} ${tipX+fwT*1.05} ${tipY+sp*0.34}
                   Q ${kxT(3)+fwT*1.8} ${OH*0.54} ${kxT(3)+fwT*1.6} ${OH-2} Z"
             fill="${skin}" opacity=".32"/>`;
    s += `<ellipse cx="${tipX}" cy="${tipY+sp*0.10}" rx="${fwT*0.50}" ry="${fwT*0.38}"
             fill="url(#nl${uid})" opacity=".24"/>`;
  }

  /* ---- הצוואר ---- */
  s += `<g clip-path="url(#bd${uid})">`;
  for(let k=-1;k<=6;k++){
    const fr = Math.round(st.base)+k;
    if(fr<1) continue;
    const fx = x(fr-0.5);
    s += `<line x1="${fx}" y1="${y(0)}" x2="${fx}" y2="${y(5)}" stroke="#7E8B9C" stroke-width="1.1"/>`;
  }
  for(let i=0;i<6;i++)
    s += `<line x1="${x(st.base+4.5)}" y1="${y(i)}" x2="${x(st.base-0.5)}" y2="${y(i)}"
            stroke="#E9EEF5" stroke-width="${1.05 + (5-i)*0.22}"/>`;
  s += `</g>`;
  if(st.base < 1.6){                                    // האגוז נראה רק בקצה הצוואר
    const nx = x(0.5);
    s += `<rect x="${nx-3}" y="${y(0)-2}" width="4" height="${y(5)-y(0)+4}" rx="1"
            fill="#DCE6E4" opacity="${Math.max(0,Math.min(1,1.6-st.base))}"/>`;
  } else {
    s += `<text x="${x(st.base+0.5)}" y="${y(0)-W*0.075}" fill="#8FA7AB" font-size="${W*0.075}"
            font-family="monospace" text-anchor="middle">${Math.round(st.base)}fr</text>`;
  }
  /* נקודות ציון בצוואר */
  [3,5,7,9,12].forEach(fr=>{
    if(fr < st.base-0.5 || fr > st.base+4.5) return;
    const fx=x(fr), cy=(y(0)+y(5))/2;
    (fr===12?[-sp*1.2,sp*1.2]:[0]).forEach(dy=>
      s += `<circle cx="${fx}" cy="${cy+dy}" r="${sp*0.16}" fill="#5C6A7A" opacity=".55"/>`);
  });

  /* ---- מיתרים פתוחים וממותתים ---- */
  const mx = x(st.base-0.5) + W*0.055;
  for(let i=0;i<6;i++){
    if(st.nums[i]===-1) s += `<text x="${mx}" y="${y(i)}" fill="#8FA7AB" font-size="${W*0.085}"
        text-anchor="middle" dominant-baseline="central">✕</text>`;
    else if(st.nums[i]===0) s += `<circle cx="${mx}" cy="${y(i)}" r="${W*0.032}" fill="none"
        stroke="#DCE6E4" stroke-width="1.4"/>`;
  }

  if(withHand){
    const fw = W*0.084;
    const ky = W*1.10;                                   /* קו פרקי האצבעות */
    const kx = f => x(st.base + 0.4 + (f-1)*0.95);       /* פרק 1 קרוב לאגוז */

    /* אצבע בשני פרקים: בסיס עבה, פרק אמצע, קצה מעוגל עם ציפורן */
    const digit = (bx,by,tx,ty,wB,wT,bend)=>{
      const mx2 = bx + (tx-bx)*0.46 + bend*0.5, my2 = by + (ty-by)*0.52;
      const c1x = bx + (mx2-bx)*0.55, c1y = by + (my2-by)*0.72;
      const c2x = mx2 + (tx-mx2)*0.45 + bend, c2y = my2 + (ty-my2)*0.42;
      let dx=tx-c2x, dy=ty-c2y; const m=Math.hypot(dx,dy)||1; dx/=m; dy/=m;
      const px=-dy*wT/2, py=dx*wT/2;
      return { d:`M ${bx-wB/2} ${by} Q ${c1x-wB*0.34} ${c1y} ${mx2-wT*0.62} ${my2}
                  Q ${c2x-wT*0.55} ${c2y} ${tx+px} ${ty+py}
                  A ${wT/2} ${wT/2} 0 0 1 ${tx-px} ${ty-py}
                  Q ${c2x+wT*0.55} ${c2y} ${mx2+wT*0.62} ${my2}
                  Q ${c1x+wB*0.34} ${c1y} ${bx+wB/2} ${by} Z`,
               mid:[mx2,my2], nx:dx, ny:dy };
    };

    /* כף היד — כמעט שקופה. במציאות היא מאחורי הצוואר ורואים רק
       את שוליה; קווי הגידים הם מה שנותן לה קריאוּת של יד. */
    const pw = fw*1.15;
    s += `<path d="M ${kx(1)+pw*1.05} ${ky-fw*0.1}
                   C ${kx(1)+pw*1.45} ${ky+W*0.17} ${kx(2)+pw*0.85} ${OH*0.86} ${kx(3)-pw*0.1} ${OH-2}
                   L ${kx(4)-pw*0.15} ${OH-2}
                   C ${kx(4)-pw*1.25} ${OH*0.84} ${kx(4)-pw*1.2} ${ky+W*0.15} ${kx(4)-pw*1.0} ${ky-fw*0.1} Z"
             fill="${skin}" opacity=".12"/>`;
    for(let f=1; f<=4; f++){
      const wx = kx(2.6), wy = OH-6;
      s += `<path d="M ${kx(f)} ${ky+fw*0.4} Q ${(kx(f)+wx)/2} ${(ky+wy)*0.52} ${wx+(f-2.5)*fw*0.55} ${wy}"
               fill="none" stroke="#FBEFDC" stroke-width="${fw*0.15}" opacity=".075"/>`;
    }

    if(st.barre && (st.bAlpha===undefined || st.bAlpha>0.05)){
      const bx = x(st.barre.fr);
      const y1 = y(6-st.barre.from), y2 = y(6-st.barre.to);
      s += `<line x1="${bx}" y1="${Math.min(y1,y2)}" x2="${bx}" y2="${Math.max(y1,y2)}"
              stroke="${skin}" stroke-width="${fw*1.3}" stroke-linecap="round"
              opacity="${0.58*(st.bAlpha===undefined?1:st.bAlpha)}"/>`;
    }

    for(let f=1; f<=4; f++){
      const t = st.F[f];
      const bx = kx(f), by = ky;
      const tx = x(t.fret), ty = y(t.str);
      const g = digit(bx, by, tx, ty, fw*1.6, fw*1.0, fh*0.14);
      const op = 0.26 + 0.36*t.down;
      s += `<path d="${g.d}" fill="${skin}" opacity="${op.toFixed(3)}"/>`;
      /* פרק אמצע */
      s += `<circle cx="${g.mid[0]}" cy="${g.mid[1]}" r="${fw*0.42}" fill="#FBEFDC" opacity="${(0.10+0.10*t.down).toFixed(3)}"/>`;
      /* ציפורן בקצה */
      s += `<ellipse cx="${tx - g.nx*fw*0.30}" cy="${ty - g.ny*fw*0.30}" rx="${fw*0.34}" ry="${fw*0.25}"
              transform="rotate(${Math.atan2(g.ny,g.nx)*180/Math.PI} ${tx - g.nx*fw*0.30} ${ty - g.ny*fw*0.30})"
              fill="url(#nl${uid})" opacity="${(0.22+0.30*t.down).toFixed(3)}"/>`;
      /* פרק כף היד */
      s += `<circle cx="${bx}" cy="${by+fw*0.1}" r="${fw*0.62}" fill="${skin}" opacity=".30"/>`;
    }
  }

  /* ---- נקודות הלחיצה ומספרי האצבעות ---- */
  if(st.barre && !withHand){
    const bx=x(st.barre.fr), y1=y(6-st.barre.from), y2=y(6-st.barre.to);
    s += `<line x1="${bx}" y1="${Math.min(y1,y2)}" x2="${bx}" y2="${Math.max(y1,y2)}" stroke="#CBA255"
            stroke-width="${fh*0.5}" stroke-linecap="round" opacity=".92"/>`;
  }
  for(let f=1; f<=4; f++){
    const t = st.F[f];
    if(t.down < 0.25) continue;
    const cx=x(t.fret), cy=y(t.str), r=fh*0.315;
    if(t.pivot) s += `<circle cx="${cx}" cy="${cy}" r="${r*1.55}" fill="none" stroke="#5FD0A8"
            stroke-width="1.6" opacity=".55"/>`;                      /* אצבע ציר */
    if(t.lift>0.05) s += `<ellipse cx="${cx}" cy="${cy+sp*0.5*t.lift}" rx="${r*0.8}" ry="${r*0.34}"
            fill="#000" opacity="${(0.28*t.lift).toFixed(3)}"/>`;      /* צל בזמן ההרמה */
    const pr = r * (1 + 0.18*(t.lift||0));
    s += `<circle cx="${cx}" cy="${cy}" r="${pr.toFixed(2)}" fill="#F0A83C"
            stroke="#7A5417" stroke-width=".8" opacity="${Math.max(0.25,t.down).toFixed(3)}"/>`;
    s += `<text x="${cx}" y="${cy}" fill="#241705" font-size="${fh*0.44}" font-weight="700"
            text-anchor="middle" dominant-baseline="central" font-family="sans-serif"
            opacity="${t.down.toFixed(3)}">${f}</text>`;
  }
  return `<svg class="dgm" width="${OW}" height="${OH}" viewBox="0 0 ${OW} ${OH}" aria-label="${esc(st.name||"")}">${s}</svg>`;
}

/* תאימות לאחור — שרטוט סטטי לפי שם אקורד */
function diagram(name, size, opt){
  const withHand = !(opt && opt.hand === false);
  return handSVG(chordState(name), size||140, withHand);
}

/* ---- מנוע המעבר ----
   ההנפשה נגזרת משעון הנגן, לא מטיימר עצמאי. לכן היא מתאימה את עצמה
   לכל מהירות נגינה בלי חישוב נוסף, והאצבע נוחתת בדיוק על הפעמה:
   התנועה מתחילה לפני חילוף האקורד ומסתיימת ברגע שהוא מתחיל. */
const chordCache = new Map();
function cState(name){
  if(!name) return null;
  if(!chordCache.has(name)) chordCache.set(name, chordState(name));
  return chordCache.get(name);
}
const handEls = new Map();          // אלמנט → {size, withHand, key}
function handRegister(el, size, withHand){
  if(!el) return;
  const prev = handEls.get(el);
  if(!prev || prev.size !== size) handEls.set(el, {size, withHand, key:""});
}
const easeIO = u => u<0.5 ? 4*u*u*u : 1-Math.pow(-2*u+2,3)/2;

let handLast = 0;
function handFrame(bi, tNow){
  if(!handEls.size) return;
  const cNow = chordAt(bi);
  const nx   = nextChordFrom(bi);
  let st = cState(cNow), key = (cNow||"-"), moving = false, movingTo = null, uEase = 0;

  if(cNow && nx && nx.c && nx.c !== cNow){
    const barDur = fitBarDur();
    const lead   = Math.max(0.22, Math.min(barDur*0.75, 0.9));
    const dt     = timeOfBar(nx.bar) - tNow;
    if(dt <= lead && dt > -0.05){
      const raw = Math.max(0, Math.min(1, 1 - dt/lead));
      /* קיטוע לעשרים שלבים: העין לא מבחינה, והדפדפן בונה SVG חמש פעמים פחות */
      const u = Math.round(raw*20)/20;
      uEase = easeIO(u);
      st = lerpState(cState(cNow), cState(nx.c), uEase, 1);
      key = cNow + ">" + nx.c + ":" + u.toFixed(2);
      moving = true; movingTo = nx.c;
    }
  }
  if(!st) return;

  /* הפעימה מוחלת כטרנספורם על המיכל ולא בבנייה מחדש של השרטוט —
     שינוי סגנון עולה כמעט כלום, בניית SVG עולה הרבה. */
  const bd = fitBarDur()/Math.max(1, S.beatsPerBar);
  const ph = bd>0 ? ((tNow - timeOfBar(bi)) % bd) / bd : 0;
  const pulse = Math.max(0, 1 - ph*3.2);

  /* תקרת קצב: לכל היותר 25 בנייה בשנייה, גם בזמן מעבר */
  const nowMs = performance.now();
  const may = !moving || (nowMs - handLast) > 40;

  /* שכבת ההדגמה על הצוואר של הנגנית — אותו מצב אקורד בדיוק */
  /* ההדגמה: פריים לכל אקורד, ומיזוג ביניהם לפי אותה התקדמות מעבר.
     כך כף היד של הנגנית באמת עוברת בין אקורדים, בלי עיוות פיקסלים. */
  const dA = $("demoA"), dB = $("demoB");
  if(dA && dB && demoOn){
    const fCur = frameFor(cNow);
    const fNext = movingTo ? frameFor(movingTo) : null;
    if(fCur && dA.dataset.n !== cNow){ dA.src = fCur; dA.dataset.n = cNow; demoLastFrame = cNow; }
    if(fNext && dB.dataset.n !== movingTo){ dB.src = fNext; dB.dataset.n = movingTo; }
    dB.style.opacity = (fNext && moving) ? uEase.toFixed(3) : "0";
    if(!fCur && demoLastFrame) { /* אקורד ללא פריים — היד נשארת במקומה */ }
    const info = $("dmInfo");
    if(info) info.textContent = fCur ? "" : (cNow ? cNow+" · אין פריים, היד נשארת" : "");
    const tag = $("dmChord"); if(tag) tag.textContent = (st && st.name) || cNow || "";
    const br = 1.004 + pulse*0.010;
    const rot = Math.sin(tNow*0.8)*0.30 + pulse*0.18;
    [dA,dB].forEach(el=>{ el.style.transform = `rotate(${rot.toFixed(2)}deg) scale(${br.toFixed(4)})`; });
    const gl = document.querySelector(".demoGlow");
    if(gl) gl.style.opacity = (0.10 + pulse*0.26).toFixed(3);
  }
  handEls.forEach((cfg, el)=>{
    if(!el.isConnected){ handEls.delete(el); return; }
    el.style.transform = `scale(${(1 + pulse*0.022).toFixed(4)})`;
    if(cfg.key === key || !may) return;
    cfg.key = key;
    el.innerHTML = handSVG(st, cfg.size, cfg.withHand);
    handLast = nowMs;
  });
}

/* ═══════════════════════════════════════════════════════════════
   חילוץ אקורדים מדף אקורדים מכל פורמט:
   שורת אקורדים מעל שורת מילים · ChordPro עם [G] בתוך השורה · רשימה.
   תוספות (7, sus, maj7, add9, סלאש) מצטמצמות למז'ור/מינור,
   כי זה מה שתצוגת האצבעות יודעת להראות.
   ═══════════════════════════════════════════════════════════════ */
const CHTOK = /^([A-G][#b]?)((?:maj|min|m|dim|aug|sus|add|M|\+|°)?[0-9]*(?:sus[0-9]?|add[0-9]+|maj[0-9]|[0-9])*)(\/[A-G][#b]?)?$/;
const isChordToken = t => CHTOK.test(t);
function baseOf(tok){
  const m = tok.match(CHTOK);
  if(!m) return null;
  const q = m[2] || "";
  return m[1] + (/^(m(?!aj)|min|dim|°)/.test(q) ? "m" : "");
}
function parseChordLines(text){
  const lines = [];
  const inline = [...String(text).matchAll(/\[([^\]\n]{1,10})\]/g)].map(m=>m[1].trim());
  if(inline.length >= 3 && inline.filter(isChordToken).length >= inline.length*0.7){
    String(text).split(/\r?\n/).forEach(L=>{
      const t = [...L.matchAll(/\[([^\]\n]{1,10})\]/g)].map(m=>baseOf(m[1].trim())).filter(Boolean);
      if(t.length) lines.push(t);
    });
    return {lines, inline:true};
  }
  String(text).split(/\r?\n/).forEach(L=>{
    const toks = L.trim().split(/[\s|,]+/).filter(Boolean);
    if(!toks.length) return;
    const hits = toks.filter(isChordToken);
    if(hits.length && hits.length >= toks.length*0.6){
      const t = hits.map(baseOf).filter(Boolean);
      if(t.length) lines.push(t);
    }
  });
  return {lines, inline:false};
}
/* בספרי אקורדים בעברית האקורדים נכתבים מימין לשמאל, ולכן חילוץ ישיר
   מחזיר כל שורה בסדר הפוך. ההיפוך הוא לכל שורה בנפרד — לא לכל הרצף. */
function parseChordSheet(text, rtl){
  const {lines, inline} = parseChordLines(text);
  const out = [];
  lines.forEach(t => out.push(...(rtl && !inline ? [...t].reverse() : t)));
  return out;
}
/* זיהוי אוטומטי: טקסט עברי ברובו = כנראה ספר אקורדים בעברית */
function looksHebrew(text){
  const heb = (String(text).match(/[\u0590-\u05FF]/g)||[]).length;
  const lat = (String(text).match(/[A-Za-z]/g)||[]).length;
  return heb > 20 && heb > lat;
}


/* ═══════════════════════════════════════════════════════════════
   3. יוטיוב
   ═══════════════════════════════════════════════════════════════ */
function ytId(u){
  u=String(u).trim();
  if(/^[\w-]{11}$/.test(u)) return u;
  const m=u.match(/(?:v=|youtu\.be\/|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);
  return m?m[1]:null;
}
function loadYT(){
  return new Promise(res=>{
    if(window.YT && window.YT.Player) return res();
    const t=document.createElement("script");
    t.src="https://www.youtube.com/iframe_api";
    window.onYouTubeIframeAPIReady=()=>res();
    document.head.appendChild(t);
  });
}
async function mountPlayer(){
  await loadYT();
  /* נגן קיים — מחליפים סרטון במקום לבנות מחדש */
  if(player && player.loadVideoById){
    try{ player.loadVideoById(S.ytId); ready = true; syncPlayerBox(); return; }catch(e){}
  }
  player = new YT.Player("ytFrame", {
    videoId: S.ytId,
    playerVars:{rel:0, modestbranding:1, playsinline:1},
    events:{
      onReady: ()=>{ ready=true;
        (function grab(n){ const d=player.getDuration&&player.getDuration();
          if(d>0){ songDur=Math.max(songDur,d); } else if(n<20) setTimeout(()=>grab(n+1),250); })(0); if(!S.title){ try{ S.title=player.getVideoData().title||"" ; $("ttl").textContent=S.title; }catch(e){} } },
      onError: ()=> toast("הסרטון אינו זמין להטמעה — נסה קישור אחר")
    }
  });
}
const T = () => (ready && player && player.getCurrentTime) ? player.getCurrentTime() : 0;
const DUR = () => (ready && player && player.getDuration) ? player.getDuration() : 0;
const playing = () => ready && player.getPlayerState && player.getPlayerState()===1;

/* ═══════════════════════════════════════════════════════════════
   4. מסכים

/* גלילת הכותרת נשארה מהמסך הקודם ו"תקעה" כפתורים מחוץ לתצוגה */
function resetTop(){
  const r = $("topRight");
  if(r) r.scrollLeft = 0;
  if(typeof syncTopH === "function") syncTopH();
}
const PAGE_BG = { start:"bg-bio", book:"bg-galaxy", settings:"bg-samurai",
                  guide:"bg-deco", about:"bg-coral", import:"bg-aqua" };
function setPageBg(m){
  const el=document.getElementById("pageBg"); if(!el) return;
  const cls=PAGE_BG[m];
  el.className = cls ? cls+" on" : "";
}
function render(){
  try{ renderInner(); }
  catch(err){
    console.error("render", err);
    /* מסך שגיאה קריא במקום מסך שבור — ואפשרות לפעול */
    app.innerHTML = `<div class="guide">
      <div class="hero-row"><h1>משהו נתקע</h1></div>
      <div class="note rust" style="margin-top:14px"><strong>הרינדור נכשל.</strong>
        ${esc(String(err && err.message || err))}</div>
      <p style="color:var(--cream-2);font-size:14px;line-height:1.7;margin-top:12px">
        לרוב זה קורה כשספר אקורדים גדול נטען לספרייה. אפשר להסיר אותו —
        השירים ששמרת בעצמך לא ייפגעו.</p>
      <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:16px">
        <button class="btn primary" id="errHome">חזרה לבית</button>
        <button class="btn" id="errDrop">הסרת הספר המיובא</button>
        <button class="btn" id="errArt">ניקוי מטמון תמונות</button>
      </div></div>`;
    const h=$("errHome"); if(h) h.onclick=()=>{ mode="start"; libFilter="all"; bookArtist=null; sbQuery=""; render(); };
    const d=$("errDrop"); if(d) d.onclick=()=>{ if(bookDrop()){ mode="start"; render(); } };
    const a2=$("errArt"); if(a2) a2.onclick=()=>{ artCache={}; artStore(); toast("המטמון נוקה"); };
  }
}
function renderInner(){
  if(mode!=="main") handEls.clear();
  setPageBg(mode);
  setTimeout(wireNav,0);
  setTimeout(paintArt, 30);
  if(mode==="guide") renderGuide();
  else if(mode==="book") renderBook();
  else if(mode==="import") renderImport();
  else if(mode==="about") renderAbout();
  else if(mode==="settings") renderSettings();
  else if(mode==="demo") renderDemo();
  else if(mode==="start") renderStart();
  else renderMain();
}

function lib(){ try{ return JSON.parse(localStorage.getItem(KEY)||"[]"); }catch(e){ return []; } }
function libSave(){
  invalidateItems();
  const l=lib().filter(x=>x.id!==S.id);
  l.unshift(JSON.parse(JSON.stringify(S)));
  try{ localStorage.setItem(KEY, JSON.stringify(l.slice(0,60))); toast("נשמר בספרייה"); }
  catch(e){ toast("השמירה נכשלה — ייצא לקובץ"); }
}


function greet(){
  const h=new Date().getHours();
  return h<5?"לילה טוב":h<12?"בוקר טוב":h<17?"צהריים טובים":h<21?"ערב טוב":"לילה טוב";
}
function tile(o){
  return `<button class="tile ${o.wide?"wide":""}" data-h="${o.act}" data-v="${esc(o.val)}">
    <span class="art ${o.round?"round":""}" style="${artStyle(o.seed)}" ${o.noart?"":`data-artist="${esc(o.seed)}"`}><i>${esc(o.icon||initial(o.seed))}</i></span>
    <span class="tx"><b>${esc(o.t)}</b><small>${esc(o.s||"")}</small></span>
    <span class="go">›</span></button>`;
}

function open_(){
  if(!S.bars.length) S.bars=Array.from({length:64},()=>({c:null}));
  mode="main"; ready=false; player=null; songDur=0; adOn=false; holdSync=false;
  cur={bar:-1,beat:-1,line:-1};
  render();
  if(S.ytId) mountPlayer();
}


/* ═══ אימות קישור ═══
   טעינת תוצאות חיפוש בתוך הנגן אינה נתמכת עוד ביוטיוב. החיפוש נפתח
   בלשונית, ואת הקישור שהודבק אפשר לאמת דרך oEmbed — נקודת קצה פתוחה
   שמחזירה שם ותמונה, כדי לראות מה מתחבר לפני שמתחייבים. */
let verifyId = null;
async function verifyLink(url){
  const id = ytId(url);
  const box = $("verBox"), inf = $("verInfo");
  if(!id){ toast("לא זיהיתי קישור יוטיוב תקין"); return; }
  verifyId = id;
  if(box) box.classList.remove("hidden");
  if(inf) inf.innerHTML = `<span class="stamp">בודק…</span>`;
  try{
    const r = await fetch("https://www.youtube.com/oembed?format=json&url=" +
      encodeURIComponent("https://www.youtube.com/watch?v=" + id));
    if(!r.ok) throw new Error("oembed");
    const d = await r.json();
    if(inf) inf.innerHTML = `<img src="${esc(d.thumbnail_url||"")}" alt="" class="verthumb">
      <div style="min-width:0"><b style="display:block;font-weight:500">${esc(d.title||"")}</b>
      <span class="stamp">${esc(d.author_name||"")}</span></div>`;
  }catch(e){
    if(inf) inf.innerHTML = `<span class="stamp" style="color:var(--ruby)">לא הצלחתי לאמת — ייתכן שהסרטון פרטי או חסום להטמעה. אפשר לנסות בכל זאת.</span>`;
  }
}
